apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: ai-services
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
  selector:
    app: ai-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
      - name: gateway
        image: ai-gateway:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: MCP_SERVER_URL
          value: "http://mcp-server-service.ai-services.svc.cluster.local:8080/sse"
        - name: OLLAMA_URL
          value: "http://ollama-service.ai-services.svc.cluster.local:11434"
        - name: OLLAMA_MODEL
          value: "qwen3.5:4b"
        - name: GATEWAY_PORT
          value: "3000"
